<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460"><rect width="1000" height="460" fill="#ffffff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}</style><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#666"/></marker></defs><text x="40" y="46" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">图 22.1　三角之外：27 格空间与三条超越路线</text>
<rect x="60" y="100" width="280" height="70" rx="10" fill="#f7f9fc" stroke="#3a6ea5" stroke-width="2"/><text x="200.0" y="141.0" font-size="18" fill="#3a6ea5" text-anchor="middle" font-weight="600">路线 A　换坐标</text>
<text x="370" y="144" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">寻找使取舍成为线性约束的坐标</text>
<rect x="60" y="190" width="280" height="70" rx="10" fill="#f7f9fc" stroke="#009E73" stroke-width="2"/><text x="200.0" y="231.0" font-size="18" fill="#009E73" text-anchor="middle" font-weight="600">路线 B　加维度</text>
<text x="370" y="234" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">是否存在第四个独立性质</text>
<rect x="60" y="280" width="280" height="70" rx="10" fill="#f7f9fc" stroke="#b8862f" stroke-width="2"/><text x="200.0" y="321.0" font-size="18" fill="#b8862f" text-anchor="middle" font-weight="600">路线 C　动态化</text>
<text x="370" y="324" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">把选择当作演化变量</text>
<rect x="620" y="130" width="330" height="240" rx="10" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="2"/><text x="785.0" y="244.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="600">27 格</text><text x="785.0" y="270.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">3 档 × 3 性质</text></svg>