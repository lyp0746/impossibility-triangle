<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#ffffff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}</style><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#666"/></marker></defs><text x="40" y="46" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">图 4.1　不可能定理的家族</text>
<rect x="60" y="100" width="260" height="62" rx="10" fill="#f7f9fc" stroke="#3a6ea5" stroke-width="2"/><text x="190.0" y="137.0" font-size="18" fill="#3a6ea5" text-anchor="middle" font-weight="600">CAP</text>
<text x="345" y="138" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">一致性/可用性/分区容忍</text>
<rect x="60" y="182" width="260" height="62" rx="10" fill="#f7f9fc" stroke="#009E73" stroke-width="2"/><text x="190.0" y="219.0" font-size="18" fill="#009E73" text-anchor="middle" font-weight="600">Arrow</text>
<text x="345" y="220" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">有序/尊重个体/非独裁</text>
<rect x="60" y="264" width="260" height="62" rx="10" fill="#f7f9fc" stroke="#b8862f" stroke-width="2"/><text x="190.0" y="301.0" font-size="18" fill="#b8862f" text-anchor="middle" font-weight="600">Mundell–Fleming</text>
<text x="345" y="302" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">固定汇率/资本流动/独立货币</text>
<rect x="60" y="346" width="260" height="62" rx="10" fill="#f7f9fc" stroke="#c94f4f" stroke-width="2"/><text x="190.0" y="383.0" font-size="18" fill="#c94f4f" text-anchor="middle" font-weight="600">无免费午餐</text>
<text x="345" y="384" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">对所有问题都不劣的算法不存在</text>
<rect x="60" y="428" width="260" height="62" rx="10" fill="#f7f9fc" stroke="#666" stroke-width="2"/><text x="190.0" y="465.0" font-size="18" fill="#666" text-anchor="middle" font-weight="600">停机问题</text>
<text x="345" y="466" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="normal">对任意程序判定终止不可计算</text>
<rect x="620" y="160" width="330" height="240" rx="10" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="2"/><text x="785.0" y="274.0" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="600">本书三角</text><text x="785.0" y="300.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">有限的描述能力在
完备 / 组合 / 传递间分配</text>
<text x="40" y="540" font-size="13" fill="#666" text-anchor="start" font-weight="normal">它们共享同一形状：有限资源在若干理想性质之间的取舍。</text></svg>