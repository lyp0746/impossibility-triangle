<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416"><rect width="1000" height="416" fill="#ffffff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}</style><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#666"/></marker></defs><text x="40" y="46" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">图 6.1　医疗的四个尺度（分钟 → 十年）</text>
<rect x="60" y="100" width="220" height="56" rx="10" fill="#f7f9fc" stroke="#c94f4f" stroke-width="2"/><text x="170.0" y="134.0" font-size="17" fill="#c94f4f" text-anchor="middle" font-weight="600">急症窗口</text>
<rect x="300" y="114" width="30" height="28" rx="6" fill="#c94f4f" opacity="0.35"/>
<text x="342" y="136" font-size="14" fill="#666" text-anchor="start" font-weight="normal">≈ 30×</text>
<rect x="60" y="174" width="220" height="56" rx="10" fill="#f7f9fc" stroke="#3a6ea5" stroke-width="2"/><text x="170.0" y="208.0" font-size="17" fill="#3a6ea5" text-anchor="middle" font-weight="600">住院/门诊</text>
<rect x="300" y="188" width="120" height="28" rx="6" fill="#3a6ea5" opacity="0.35"/>
<text x="432" y="210" font-size="14" fill="#666" text-anchor="start" font-weight="normal">≈ 120×</text>
<rect x="60" y="248" width="220" height="56" rx="10" fill="#f7f9fc" stroke="#009E73" stroke-width="2"/><text x="170.0" y="282.0" font-size="17" fill="#009E73" text-anchor="middle" font-weight="600">慢病随访</text>
<rect x="300" y="262" width="400" height="28" rx="6" fill="#009E73" opacity="0.35"/>
<text x="712" y="284" font-size="14" fill="#666" text-anchor="start" font-weight="normal">≈ 400×</text>
<rect x="60" y="322" width="220" height="56" rx="10" fill="#f7f9fc" stroke="#b8862f" stroke-width="2"/><text x="170.0" y="356.0" font-size="17" fill="#b8862f" text-anchor="middle" font-weight="600">公卫/代际</text>
<rect x="300" y="336" width="700" height="28" rx="6" fill="#b8862f" opacity="0.35"/>
<text x="1012" y="358" font-size="14" fill="#666" text-anchor="start" font-weight="normal">≈ 700×</text>
<text x="40" y="400" font-size="13" fill="#666" text-anchor="start" font-weight="normal">急性窗口以分钟计，慢病结局以十年计；制度若用同一套指标考核两者，必然在一端失真。</text></svg>