<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#ffffff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}</style><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#666"/></marker></defs><text x="40" y="46" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">图 13.1　学术体制的隐性选择与 C+T 飞地</text>
<rect x="60" y="110" width="420" height="240" rx="10" fill="#f7f9fc" stroke="#3a6ea5" stroke-width="2"/><text x="270.0" y="224.0" font-size="22" fill="#3a6ea5" text-anchor="middle" font-weight="600">主流：A + T</text><text x="270.0" y="250.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">可量化、可比较、可管理</text>
<text x="90" y="300" font-size="14" fill="#c94f4f" text-anchor="start" font-weight="normal">代价：C（深度积累）与 T（长期因果）被压缩</text>
<rect x="560" y="110" width="380" height="240" rx="10" fill="#eefaf4" stroke="#009E73" stroke-width="2"/><text x="750.0" y="224.0" font-size="22" fill="#009E73" text-anchor="middle" font-weight="600">C+T 飞地</text><text x="750.0" y="250.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">长期资助 / 跨学科中心 / 多元发表</text>
<line x1="480" y1="230" x2="560" y2="230" stroke="#b8862f" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="420" font-size="13" fill="#666" text-anchor="start" font-weight="normal">更新 = 在主流之外保留可问责的另一种选择，而非改造主流。</text></svg>