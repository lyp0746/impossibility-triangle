<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420"><rect width="1000" height="420" fill="#ffffff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}</style><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#666"/></marker></defs><text x="40" y="46" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">图 8.1　教育的三条轨道与三角选择</text>
<rect x="60" y="100" width="200" height="70" rx="10" fill="#f7f9fc" stroke="#3a6ea5" stroke-width="2"/><text x="160.0" y="141.0" font-size="20" fill="#3a6ea5" text-anchor="middle" font-weight="600">快速轨道</text>
<rect x="300" y="100" width="160" height="70" rx="10" fill="#ffffff" stroke="#3a6ea5" stroke-width="2"/><text x="380.0" y="141.0" font-size="20" fill="#3a6ea5" text-anchor="middle" font-weight="600">C + T</text>
<text x="500" y="144" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="normal">小班化、个性化追踪</text>
<rect x="60" y="190" width="200" height="70" rx="10" fill="#f7f9fc" stroke="#009E73" stroke-width="2"/><text x="160.0" y="231.0" font-size="20" fill="#009E73" text-anchor="middle" font-weight="600">标准轨道</text>
<rect x="300" y="190" width="160" height="70" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/><text x="380.0" y="231.0" font-size="20" fill="#009E73" text-anchor="middle" font-weight="600">A + T</text>
<text x="500" y="234" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="normal">标准课程、持续评估</text>
<rect x="60" y="280" width="200" height="70" rx="10" fill="#f7f9fc" stroke="#b8862f" stroke-width="2"/><text x="160.0" y="321.0" font-size="20" fill="#b8862f" text-anchor="middle" font-weight="600">探索轨道</text>
<rect x="300" y="280" width="160" height="70" rx="10" fill="#ffffff" stroke="#b8862f" stroke-width="2"/><text x="380.0" y="321.0" font-size="20" fill="#b8862f" text-anchor="middle" font-weight="600">C + A</text>
<text x="500" y="324" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="normal">选课制、灵活进度</text>
<text x="40" y="400" font-size="13" fill="#666" text-anchor="start" font-weight="normal">三条轨道并行：承认无法用单一轨道同时满足三种需求。</text></svg>