<text x="500" y="165" font-size="14" fill="#b8862f" text-anchor="middle" font-weight="600">诊断（一次区分）</text>
<line x1="670" y1="215" x2="330" y2="215" stroke="#c94f4f" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="245" font-size="14" fill="#c94f4f" text-anchor="middle" font-weight="600">行为改变（诊断即干预）</text>
<path d="M 205 240 C 205 380 795 380 795 240" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="7,6" marker-end="url(#ar)"/>
<text x="500" y="360" font-size="15" fill="#666" text-anchor="middle" font-weight="normal">新的观察 → 框架更新  M_{t+1} = Update(M_t, E_t)</text>
<text x="40" y="460" font-size="13" fill="#666" text-anchor="start" font-weight="normal">Goodhart 定律 · 自我实现预言 · 反身性：诊断不是被动测量。</text></svg>