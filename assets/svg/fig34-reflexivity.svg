<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480"><rect width="1000" height="480" fill="#ffffff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}</style><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#666"/></marker></defs><text x="40" y="46" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">图 U.1　诊断的反身循环：观察者改变系统</text>
<rect x="80" y="150" width="250" height="90" rx="10" fill="#eef3f8" stroke="#3a6ea5" stroke-width="2"/><text x="205.0" y="189.0" font-size="18" fill="#3a6ea5" text-anchor="middle" font-weight="600">框架 / 观察者</text><text x="205.0" y="215.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">区分：C-A-T</text>
<rect x="670" y="150" width="250" height="90" rx="10" fill="#eefaf4" stroke="#009E73" stroke-width="2"/><text x="795.0" y="189.0" font-size="18" fill="#009E73" text-anchor="middle" font-weight="600">被诊断系统</text><text x="795.0" y="215.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">行为与配置</text>
