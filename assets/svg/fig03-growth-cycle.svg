<text x="525" y="300" text-anchor="middle" font-size="15" fill="#666">代价：丢失精妙与边界</text>
<line x1="655" y1="205" x2="720" y2="205" stroke="#c94f4f" stroke-width="3" marker-end="url(#ar)"/>
<rect x="730" y="150" width="250" height="110" rx="10" fill="#ffffff" stroke="#b8862f" stroke-width="2"/><text x="855.0" y="197.0" text-anchor="middle" font-size="22" font-weight="600" fill="#b8862f">工程化</text><text x="855.0" y="225.0" text-anchor="middle" font-size="15" fill="#666">C + A</text>
<text x="855" y="300" text-anchor="middle" font-size="15" fill="#666">代价：失去“为什么”</text>
<path d="M 900 205 C 960 205 960 470 500 470 C 250 470 195 470 195 300" fill="none" stroke="#c94f4f" stroke-width="2.6" stroke-dasharray="8,6" marker-end="url(#ar)"/>
<text x="560" y="456" text-anchor="middle" font-size="17" fill="#c94f4f" font-weight="600">危机：旧三边碎裂 → 重返 C+T</text>
<text x="40" y="540" font-size="15" fill="#888">箭头表示“被让出的顶点的转移”，不是水平提高。此模式是组织方式，不是历史定律。</text>
