<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#ffffff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',Georgia,serif;}</style><text x="40" y="46" font-size="24" font-weight="700">图 11.1　三阶段成长与危机：连续换顶点</text>
<rect x="70" y="150" width="250" height="110" rx="10" fill="#ffffff" stroke="#3a6ea5" stroke-width="2"/><text x="195.0" y="197.0" text-anchor="middle" font-size="22" font-weight="600" fill="#3a6ea5">范式建立</text><text x="195.0" y="225.0" text-anchor="middle" font-size="15" fill="#666">C + T</text>
<text x="195" y="300" text-anchor="middle" font-size="15" fill="#666">代价：难教学、依赖个人</text>
